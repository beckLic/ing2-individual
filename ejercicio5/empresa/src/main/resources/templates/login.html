<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Spark Admin</title>
    <!-- Los assets deben estar en src/main/resources/static/assets/ -->
    <link rel="stylesheet" th:href="@{/assets/libs/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/assets/libs/bootstrap-icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/assets/css/main.css}">
</head>
<body>
<div class="login-wrapper">
    <div class="login-bg-shape login-bg-shape-1"></div>
    <div class="login-bg-shape login-bg-shape-2"></div>

    <div class="login-card">
        <a href="#" class="login-brand text-decoration-none">
            <i class="bi bi-asterisk"></i>
            <span>Empresa</span>
        </a>

        <p class="login-subtitle">Ingrese sus credenciales</p>

        <!-- Bloque de alerta de error capturado desde el Controller -->
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

        <!-- El formulario mapea los campos al objeto loginDto del Controller -->
        <form th:action="@{/login}" th:object="${loginDto}" method="POST" id="loginForm" class="needs-validation">

            <div class="login-form-group">
                <label for="username" class="login-form-label">Usuario</label>
                <div class="login-input-group">
                    <i class="bi bi-person input-icon"></i>
                    <input type="text" id="username" th:field="*{username}" class="login-input" placeholder="Ej: admin" required>
                </div>
            </div>

            <div class="login-form-group">
                <label for="password" class="login-form-label">Contraseña</label>
                <div class="login-input-group">
                    <i class="bi bi-shield-lock input-icon"></i>
                    <input type="password" id="password" th:field="*{password}" class="login-input login-input-password" placeholder="Ej: admin123" required>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btn-submit">
                <span>Ingresar al Sistema</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>
    </div>
</div>

<script th:src="@{/assets/libs/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
