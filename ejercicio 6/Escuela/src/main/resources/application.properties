# ==========================================
# CONFIGURACIÓN DE BASE DE DATOS (MYSQL)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/escuela?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# CONFIGURACIÓN DE HIBERNATE ENVERS (AUDITORÍA)
# ==========================================
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_AUD

# ==========================================
# CONFIGURACIÓN DE CORREO (SPRING MAIL)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=escuela@gmail.com
# Recordá usar una "Contraseña de Aplicación" si usás Gmail con 2FA
spring.mail.password=1234
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# CONFIGURACIÓN DE THYMELEAF (VISTAS)
# ==========================================
# Desactiva el caché para ver los cambios en HTML sin reiniciar el server
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

server.port=8081