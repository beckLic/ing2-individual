<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro Profesor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-success text-white text-center">
                    <h4>Registro de Nuevo Profesor</h4>
                </div>
                <div class="card-body">
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <form th:action="@{/registro}" th:object="${profesorDTO}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>Nombre</label>
                                <input type="text" th:field="*{nombre}" class="form-control">
                                <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="text-danger text-sm"></span>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Apellido</label>
                                <input type="text" th:field="*{apellido}" class="form-control">
                                <span th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}" class="text-danger text-sm"></span>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>DNI</label>
                                <input type="number" th:field="*{dni}" class="form-control">
                                <span th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}" class="text-danger text-sm"></span>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Título</label>
                                <input type="text" th:field="*{titulo}" class="form-control">
                                <span th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}" class="text-danger text-sm"></span>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Sexo</label>
                                <select th:field="*{sexo}" class="form-select">
                                    <option value="" disabled selected>Seleccione...</option>
                                    <option value="MASCULINO">Masculino</option>
                                    <option value="FEMENINO">Femenino</option>
                                    <option value="OTRO">Otro</option>
                                </select>
                                <span th:if="${#fields.hasErrors('sexo')}" th:errors="*{sexo}" class="text-danger text-sm"></span>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Fecha de Nacimiento</label>
                                <input type="date" th:field="*{fechaNacimiento}" class="form-control">
                                <span th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}" class="text-danger text-sm"></span>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Email (Usuario)</label>
                                <input type="email" th:field="*{email}" class="form-control">
                                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger text-sm"></span>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Contraseña</label>
                                <input type="password" th:field="*{password}" class="form-control">
                                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger text-sm"></span>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 mt-2">Completar Registro</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
