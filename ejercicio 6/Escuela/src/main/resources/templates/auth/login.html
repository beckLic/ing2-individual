<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4>Iniciar Sesión</h4>
                </div>
                <div class="card-body">
                    <div th:if="${param.error}" class="alert alert-danger">Credenciales inválidas.</div>
                    <div th:if="${param.logout}" class="alert alert-success">Sesión cerrada.</div>
                    <div th:if="${param.registrado}" class="alert alert-success">Registro exitoso. Inicia sesión.</div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Contraseña</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </form>
                    <div class="text-center mt-3">
                        <a th:href="@{/registro}">¿No eres profesor? Regístrate aquí</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
