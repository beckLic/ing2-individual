<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Login Page</title>
</head>
<body>

    <div class="container"> 
        <div class="container-form">
            <form class="sign-in"> 
                <h2> iniciar sesion</h2>
                <div class="social-networks">   
                    <ion-icon name="logo-twitter"></ion-icon>
                    <ion-icon name="logo-whatsapp"></ion-icon>
                    <ion-icon name="logo-facebook"></ion-icon>
                </div>
                <span class="span">use su correo y contraseña</span>
                <div class="input-container">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input type="text" placeholder="correo electronico">
                </div>
                <div class="input-container">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" placeholder="contraseña">
                </div>
                <a href="#">¿olvidaste tu contraseña?</a>
                <button class="button">iniciar sesion</button>
            </form>

        </div>
        <div class="container-form">
            <form class="sign-up"> 
                <h2>registrarse</h2>
                <div class="social-networks">   
                    <ion-icon name="logo-twitter"></ion-icon>
                    <ion-icon name="logo-whatsapp"></ion-icon>
                    <ion-icon name="logo-facebook"></ion-icon>
                </div>
                <span class="span">use su correo electronico para registrarse</span>
                 <div class="input-container">
                    <ion-icon name="person-outline"></ion-icon>
                    <input type="text" placeholder="usuario">
                </div>
                <div class="input-container">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input type="text" placeholder="correo electronico">
                </div>
                <div class="input-container">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" placeholder="contraseña">
                </div>
                <button class="button">registrarse</button>
            </form>
        </div>
        <div class="container-welcome"> 
            <div class="welcome-sign-up welcome"> 
                <h3>Bienvenido</h3>
                <p>Si ya tienes una cuenta, inicia sesión</p>
                <button class="button" id="btn-sign-up">iniciar sesion</button>
            </div>
            <div class="welcome-sign-in welcome"> 
                <h3>Hola</h3>
                <p>registrate si no tenes cuenta</p>
                <button class="button" id="btn-sign-in">registrarse</button>

            </div>

        </div>
    </div>

    <script src="script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
